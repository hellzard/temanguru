name: Laporan bug
description: Laporkan masalah tanpa menyertakan data pribadi murid.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Jangan masukkan nama murid, email, token, screenshot data nyata, atau kredensial.
  - type: textarea
    id: problem
    attributes:
      label: Apa yang terjadi?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Langkah reproduksi dengan data contoh
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Perangkat dan browser
  - type: textarea
    id: expected
    attributes:
      label: Hasil yang diharapkan
